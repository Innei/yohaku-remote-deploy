name: Self-hosted runner check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-check
  cancel-in-progress: false

jobs:
  check:
    name: Verify local CI environment
    runs-on: [self-hosted, macOS, ARM64, ci-account, validation-yohaku-remote-deploy]
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Verify isolated ci account
        run: |
          set -euo pipefail
          test "$(id -un)" = ci
          test "$HOME" = /Users/ci
          test -z "${GIT_CONFIG_GLOBAL:-}"
          case "$PATH" in *'/Users/innei/'*) echo 'Personal tool path inherited'; exit 1;; esac
          if git config --global --name-only --get-regexp '^(include|http\..*extraheader)'; then
            echo 'Unexpected global Git authentication/include configuration'
            exit 1
          fi
          id
          echo "CI HOME=$HOME"
      - name: Verify local tools
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -q '^Xcode 27\.' <<< "$xcode_version"
          xcrun --sdk iphoneos --show-sdk-version
          pod --version
          git lfs version
          jq --version
          gh --version
          python3 --version
          xcbeautify --version

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          repository: innei-dev/yohaku
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          ref: main
          lfs: true
          submodules: recursive

      - name: Checkout deploy scripts (nested checkout regression)
        uses: actions/checkout@v6
        with:
          path: .deploy
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        env:
          HOME: ${{ runner.temp }}/bun-home

      - name: Install mobile dependencies
        run: |
          ln -sfn ../node_modules yohaku-oss/node_modules
          pnpm install --frozen-lockfile --filter @yohaku/mobile...

      - name: Verify iOS runtime fingerprint
        working-directory: apps/mobile
        run: |
          ./node_modules/.bin/fingerprint fingerprint:generate --platform ios > "$RUNNER_TEMP/fp.json"
          hash="$(jq -r .hash "$RUNNER_TEMP/fp.json")"
          [[ "$hash" =~ ^[a-zA-Z0-9]{16,}$ ]]
          echo "iOS runtime fingerprint: $hash"

      - name: Generate native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --non-interactive --no-install

      - name: Install iOS Pods
        working-directory: apps/mobile/ios
        run: pod install --deployment || pod install

      - name: Verify CI distribution signing
        env:
          DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: /bin/bash .deploy/.github/scripts/check-ci-signing.sh

      - name: Prepare isolated Docker configuration
        id: docker
        run: |
          set -euo pipefail
          docker_host='unix:///Users/ci/.colima/default/docker.sock'
          ready=false
          for attempt in {1..60}; do
            if docker --host "$docker_host" info >/dev/null 2>&1; then ready=true; break; fi
            sleep 3
          done
          if [ "$ready" != true ]; then echo 'CI Docker daemon did not become ready'; exit 1; fi
          docker_config="$(mktemp -d "$RUNNER_TEMP/docker.XXXXXX")"
          mkdir -p "$docker_config/cli-plugins"
          # Prevent Docker from auto-selecting the macOS keychain helper.
          printf '%s\n' '{"auths":{"https://index.docker.io/v1/":{}}}' > "$docker_config/config.json"
          if [ -x "$HOME/.docker/cli-plugins/docker-buildx" ]; then
            cp "$HOME/.docker/cli-plugins/docker-buildx" "$docker_config/cli-plugins/docker-buildx"
          fi
          {
            echo "DOCKER_HOST=$docker_host"
            echo "DOCKER_CONFIG=$docker_config"
          } >> "$GITHUB_ENV"
          echo "host=$docker_host" >> "$GITHUB_OUTPUT"

      - name: Enable linux/amd64 emulation in CI Docker
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          endpoint: ${{ steps.docker.outputs.host }}

      - name: Prepare Docker smoke build
        run: |
          mkdir -p "$RUNNER_TEMP/docker-smoke"
          cat > "$RUNNER_TEMP/docker-smoke/Dockerfile" <<'DOCKERFILE'
          FROM alpine:3.22
          RUN test "$(uname -m)" = x86_64
          DOCKERFILE

      - name: Verify linux/amd64 Docker build
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/docker-smoke
          platforms: linux/amd64
          push: false
